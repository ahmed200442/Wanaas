name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
      - clean-v19
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wanas-android-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare Keystore & Environment Files
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cat > .env <<'EOF'
SUPABASE_URL=https://txpkrctvdtjcptotfqer.supabase.co
SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4cGtyY3R2ZHRqY3B0b3RmcWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNTMwMTYsImV4cCI6MjEwNjYyOTAxNn0._nCaFSgqzjiGFJW28G6Y5WJ68jp1oqkSnASVx7NJKog
EOF
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - name: Prepare APK for Download
        run: cp app/build/outputs/apk/debug/app-debug.apk ./wanas-latest.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wanas-android-apk
          path: wanas-latest.apk
      - name: Create or Update GitHub Release with Direct APK Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "أحدث نسخة من تطبيق وَنَس (APK)"
          body: |
            ### 📲 رابط تحميل تطبيق وَنَس (APK) المباشر
            اضغط على ملف **`wanas-latest.apk`** بالأسفل لتحميل وتثبيت أحدث نسخة من التطبيق مباشرة على هاتفك.
          files: wanas-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
